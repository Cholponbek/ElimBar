name: elimbar

# Один монолит, один compose. Всё поднимается одной командой на VPS в КР —
# без микросервисов и без внешних управляемых БД (данные бенефициаров не
# покидают юрисдикцию, включая резервные копии — см. ARCHITECTURE.md §10).

x-app-env: &app-env
  env_file: [.env]

services:
  # Код, vendor/ и собранный public/build запечены в образ на этапе build
  # (docker/php/Dockerfile) — никаких bind-mount volumes поверх контейнера:
  # редеплой на VPS это git pull + docker compose up -d --build, не hot-reload.
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    <<: *app-env
    entrypoint: /entrypoint.sh
    volumes:
      # Только фактически изменяемые данные — загруженные фото кейсов
      # (Storage::disk('public')). Всё остальное под public/ — статика,
      # уже запечённая в образ, ей volume не нужен.
      - case_photos:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [elimbar]
    restart: unless-stopped

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    <<: *app-env
    command: php artisan horizon
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [elimbar]
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    <<: *app-env
    # Драйвит лестницу ретраев рекуррента (1/3/7 дней) и ежедневную садаку.
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [elimbar]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-elimbar}
      POSTGRES_USER: ${DB_USERNAME:-elimbar_owner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-elimbar_owner} -d ${DB_DATABASE:-elimbar}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [elimbar]
    # Порт наружу не публикуется по умолчанию — доступ только из сети compose.
    # Раскомментировать на время локальной отладки:
    # ports: ["127.0.0.1:5432:5432"]

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks: [elimbar]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [elimbar]
    # Консоль MinIO (9001) не публикуется наружу — только через caddy/VPN
    # при необходимости.

  # MinIO не создаёт бакет сам — без этого шага загрузка первого же proof
  # упадёт с NoSuchBucket. Разовый контейнер, безопасно перезапускать
  # (--ignore-existing).
  minio-init:
    image: minio/mc:latest
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${AWS_BUCKET:-elimbar-proofs}
      "
    <<: *app-env
    depends_on:
      minio:
        condition: service_healthy
    networks: [elimbar]
    restart: "no"

  # Caddy — отдельный контейнер (другая файловая система), поэтому не может
  # раздать public/build, public/images и т.п. напрямую из образа app.
  # Разовый контейнер копирует актуальную статику из свежесобранного
  # образа app в volume, который caddy монтирует read-only — пересобирается
  # и перезаписывается при каждом `docker compose up -d --build`, то есть
  # на каждый деплой Caddy отдаёт то, что реально в этом билде app.
  static-sync:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    entrypoint: []
    command: sh -c "rm -rf /shared/* && cp -r /var/www/html/public/. /shared/"
    volumes:
      - public_static:/shared
    networks: [elimbar]
    restart: "no"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - public_static:/var/www/html/public:ro
      # Смонтирован ПОВЕРХ public/storage внутри public_static — те же
      # файлы, что app пишет в case_photos, видны здесь сразу, без задержки
      # до следующего static-sync (в отличие от статики выше, фото должны
      # быть доступны сразу после загрузки в Filament).
      - case_photos:/var/www/html/public/storage:ro
    depends_on:
      app:
        condition: service_started
      static-sync:
        condition: service_completed_successfully
    networks: [elimbar]

networks:
  elimbar:

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  case_photos:
  public_static:
