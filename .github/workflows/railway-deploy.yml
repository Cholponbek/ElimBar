name: Deploy demo (Railway)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # This is a PROJECT token (created inside an already-existing Railway
      # project → Settings → Tokens), not an account token. Project tokens
      # use the RAILWAY_TOKEN env var name and are scoped to one project +
      # environment — no `railway login` needed, but also no `whoami`
      # (there's no "user" in this auth mode).
      #
      # CLI quirks discovered the hard way:
      # - `status`/`up` resolve project context straight from RAILWAY_TOKEN,
      #   but `add`/`service list`/`variable *` don't — they need an actual
      #   local `railway link` first, or they report "Project not found".
      # - `service list --json` came back `[]` even with a service
      #   confirmed to exist via `status --json` — use `status --json` for
      #   service discovery instead.
      # - `services.edges[0]` is NOT reliably the app service once more
      #   than one service exists — an earlier run picked the Postgres
      #   plugin as "the app" this way and deployed the Laravel Docker
      #   image onto it (`railway up --service Postgres`), corrupting it.
      #   The app service name is now hardcoded below instead of guessed.
      # - The "elimbar-demo" service (auto-created by Railway's dashboard
      #   "Empty Project" flow) never had a real deployment, and `railway
      #   up --service elimbar-demo` consistently 404s on code upload
      #   ({"code":"UPLOAD_FAILED",...}) across multiple separate runs —
      #   it looks structurally broken for a headless project-token
      #   upload targeting a service with no prior ServiceInstance. `up
      #   --service Postgres` worked fine earlier specifically because
      #   Postgres already had a real deployment. Fix: target a NEW
      #   service name so `up` creates a fresh, properly-initialized one
      #   instead of fighting the broken placeholder (which gets deleted
      #   below alongside the earlier corrupted "Postgres").
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      APP_SERVICE: web
      APP_KEY: "base64:l+hJHtDNk4lV1l5RnDRbS6nM1FfKuR1ZK7j7R5vt+5k="
      DB_STAFF_PASSWORD: "325611af4e8ba0b692b44794e9659d7b"
      DB_PUBLIC_PASSWORD: "63e7cf84f718bc4a0f3634494a521461"
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Project status (diagnostic — project tokens have no whoami)
        id: status0
        run: |
          railway status --json | tee /tmp/status0.json
          PROJECT_ID=$(jq -r '.id' /tmp/status0.json)
          ENV_ID=$(jq -r '.environments.edges[0].node.id' /tmp/status0.json)
          echo "project_id=$PROJECT_ID" | tee -a "$GITHUB_OUTPUT"
          echo "env_id=$ENV_ID" | tee -a "$GITHUB_OUTPUT"
          echo "All services in project right now:"
          jq -r '.services.edges[].node.name' /tmp/status0.json

      - name: Link (needed by add/service/variable commands, not by up/status)
        run: |
          railway link --project "${{ steps.status0.outputs.project_id }}" --environment "${{ steps.status0.outputs.env_id }}" --json || true

      - name: Clean up broken/corrupted services from previous runs
        run: |
          # "Postgres": a prior run's service-name guess deployed the
          # Laravel image onto the actual Postgres plugin. The real
          # database survived under an auto-deduped name (e.g.
          # "Postgres-QUoE", discovered below) and is untouched.
          # "elimbar-demo": the original dashboard-created empty
          # placeholder that never accepted a code upload. Both deletes
          # are no-ops (safe to keep re-running) once the services are gone.
          railway service delete --service Postgres --yes --json || true
          railway service delete --service elimbar-demo --yes --json || true

      - name: Deploy app service from Dockerfile
        run: |
          # Ensure a fresh "web" service exists before uploading code to it
          # (harmless no-op if it's already there from a prior attempt).
          railway add --service "$APP_SERVICE" --json || true
          sleep 3

          # railway CLI often exits 0 even when the call itself failed (it
          # just prints an {"code":...,"error":...} JSON object) — a plain
          # `up | tee` swallows that and every downstream step then chases
          # a deploy that never happened. Check for a real deploymentId and
          # retry/fail loudly instead.
          for i in 1 2 3; do
            railway up -y --detach --json --service "$APP_SERVICE" | tee /tmp/up.json
            if jq -e '.deploymentId' /tmp/up.json >/dev/null 2>&1; then
              echo "Deploy queued OK on attempt $i"
              break
            fi
            echo "Attempt $i: up failed ($(cat /tmp/up.json)), retrying in 15s"
            sleep 15
            if [ "$i" = "3" ]; then
              echo "::error::railway up failed 3 times, aborting rather than wasting time downstream"
              exit 1
            fi
          done

      - name: Find or create the Postgres service
        id: names
        run: |
          railway status --json | tee /tmp/status1.json
          PG_NAME=$(jq -r --arg appname "$APP_SERVICE" '[.services.edges[].node | select(.name != $appname)][0].name // empty' /tmp/status1.json)

          if [ -z "$PG_NAME" ]; then
            echo "No existing Postgres-like service found, provisioning one."
            railway add --database postgres --json | tee /tmp/add.json
            sleep 5
            railway status --json | tee /tmp/status2.json
            PG_NAME=$(jq -r --arg appname "$APP_SERVICE" '[.services.edges[].node | select(.name != $appname)][0].name // empty' /tmp/status2.json)
          fi

          echo "pg_name=$PG_NAME" | tee -a "$GITHUB_OUTPUT"
          echo "Resolved app=$APP_SERVICE postgres=$PG_NAME"

      - name: Discover Postgres connection details
        id: pg
        run: |
          PG_NAME="${{ steps.names.outputs.pg_name }}"
          railway variable list --service "$PG_NAME" --json | tee /tmp/pgvars.json

          DB_HOST=$(jq -r '.PGHOST // empty' /tmp/pgvars.json)
          DB_PORT=$(jq -r '.PGPORT // empty' /tmp/pgvars.json)
          DB_DATABASE=$(jq -r '.PGDATABASE // empty' /tmp/pgvars.json)
          DB_USERNAME=$(jq -r '.PGUSER // empty' /tmp/pgvars.json)
          DB_PASSWORD=$(jq -r '.PGPASSWORD // empty' /tmp/pgvars.json)

          if [ -z "$DB_HOST" ]; then
            DATABASE_URL=$(jq -r '.DATABASE_URL // empty' /tmp/pgvars.json)
            if [ -n "$DATABASE_URL" ]; then
              eval "$(DATABASE_URL="$DATABASE_URL" python3 -c "import os, urllib.parse as up; u = up.urlparse(os.environ['DATABASE_URL']); print(f'DB_HOST={u.hostname}'); print(f'DB_PORT={u.port}'); print(f'DB_DATABASE={u.path.lstrip(chr(47))}'); print(f'DB_USERNAME={u.username}'); print(f'DB_PASSWORD={u.password}')")"
            fi
          fi

          echo "Resolved: host=$DB_HOST port=$DB_PORT db=$DB_DATABASE user=$DB_USERNAME pass_len=${#DB_PASSWORD}"
          {
            echo "host=$DB_HOST"
            echo "port=$DB_PORT"
            echo "database=$DB_DATABASE"
            echo "username=$DB_USERNAME"
            echo "password=$DB_PASSWORD"
          } >> "$GITHUB_OUTPUT"

      - name: Set app environment variables
        run: |
          set -- \
            "APP_NAME=ElimBar" \
            "APP_ENV=production" \
            "APP_KEY=$APP_KEY" \
            "APP_DEBUG=true" \
            "APP_LOCALE=ky" \
            "APP_FALLBACK_LOCALE=ru" \
            "APP_FAKER_LOCALE=ru_RU" \
            "APP_MAINTENANCE_DRIVER=file" \
            "BCRYPT_ROUNDS=12" \
            "TENANT_ID=1" \
            "LOG_CHANNEL=stack" \
            "LOG_LEVEL=debug" \
            "DB_CONNECTION=pgsql" \
            "DB_HOST=${{ steps.pg.outputs.host }}" \
            "DB_PORT=${{ steps.pg.outputs.port }}" \
            "DB_DATABASE=${{ steps.pg.outputs.database }}" \
            "DB_USERNAME=${{ steps.pg.outputs.username }}" \
            "DB_PASSWORD=${{ steps.pg.outputs.password }}" \
            "DB_STAFF_USERNAME=elimbar_staff" \
            "DB_STAFF_PASSWORD=$DB_STAFF_PASSWORD" \
            "DB_PUBLIC_USERNAME=elimbar_public" \
            "DB_PUBLIC_PASSWORD=$DB_PUBLIC_PASSWORD" \
            "SESSION_DRIVER=database" \
            "SESSION_LIFETIME=120" \
            "CACHE_STORE=database" \
            "QUEUE_CONNECTION=sync" \
            "BROADCAST_CONNECTION=log" \
            "FILESYSTEM_DISK=local" \
            "MAIL_MAILER=log"

          for kv in "$@"; do
            key="${kv%%=*}"
            echo "Setting $key"
            railway variable set "$kv" --service "$APP_SERVICE" --skip-deploys --json >/dev/null
          done

      - name: Generate public domain
        id: domain
        run: |
          # `up --detach` only queues the build — Railway doesn't create the
          # ServiceInstance (service+environment+deployment binding) that
          # `domain` needs until the build has actually started registering
          # on the platform. A domain call right after `up` reliably fails
          # with "ServiceInstance not found", so retry with backoff instead
          # of accepting the first failure.
          DOMAIN=""
          for i in $(seq 1 15); do
            railway domain --service "$APP_SERVICE" --json | tee /tmp/domain.json || true
            DOMAIN=$(jq -r '.domain // .domains[0].domain // empty' /tmp/domain.json 2>/dev/null)
            if [ -z "$DOMAIN" ]; then
              DOMAIN=$(grep -oE '[a-zA-Z0-9.-]+\.up\.railway\.app' /tmp/domain.json | head -n1 || true)
            fi
            if [ -n "$DOMAIN" ]; then
              echo "Got domain on attempt $i"
              break
            fi
            echo "Attempt $i: no domain yet ($(cat /tmp/domain.json)), retrying in 10s"
            sleep 10
          done
          # `.domain` in the JSON response is a full URL (with scheme),
          # not a bare hostname — normalize so downstream steps can
          # consistently prepend "https://" themselves without doubling up.
          DOMAIN=$(echo "$DOMAIN" | sed -E 's#^https?://##')
          echo "Resolved domain: $DOMAIN"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Set APP_URL and trigger real deploy
        run: |
          DOMAIN="${{ steps.domain.outputs.domain }}"
          if [ -n "$DOMAIN" ]; then
            railway variable set "APP_URL=https://$DOMAIN" --service "$APP_SERVICE" --json
            railway variable set "APP_DOMAIN=$DOMAIN" --service "$APP_SERVICE" --json
          else
            echo "No domain resolved — check the 'Generate public domain' step output; triggering redeploy without APP_URL update."
            railway redeploy --service "$APP_SERVICE" --yes --json || true
          fi

      - name: Wait for the Docker build + boot, then snapshot logs and probe the URL
        continue-on-error: true
        run: |
          echo "Waiting 150s for the composer/npm Docker build and container boot..."
          sleep 150
          echo "--- railway logs ---"
          railway logs --service "$APP_SERVICE" --json --lines 300 || true
          DOMAIN="${{ steps.domain.outputs.domain }}"
          if [ -n "$DOMAIN" ]; then
            echo "--- curl https://$DOMAIN/ ---"
            curl -sS -o /tmp/probe.html -w "HTTP_STATUS:%{http_code}\n" "https://$DOMAIN/" || true
            head -c 2000 /tmp/probe.html || true
          fi
