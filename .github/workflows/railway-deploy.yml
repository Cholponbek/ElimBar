name: Deploy demo (Railway)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: elimbar-demo
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: login --help
        run: railway login --help

      - name: whoami --help
        run: railway whoami --help

      - name: Confirm token works via raw API (sanity check)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ me { id email } }"}' \
            -w "\nHTTP_STATUS:%{http_code}\n"

      - name: Try login --browserless with token piped in
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "$RAILWAY_TOKEN" | railway login --browserless || echo "browserless login failed (exit $?)"

      - name: whoami after browserless login attempt
        run: railway whoami || echo "still unauthorized"

      - name: Try RAILWAY_API_TOKEN again with explicit config dir check
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway whoami || true
          echo "--- config dir ---"
          find ~/.railway -type f 2>/dev/null | xargs -I{} sh -c 'echo {}; cat {}' 2>/dev/null || echo "no config dir"
