name: Verify case photo upload on live demo

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright@1.48.0
      - run: npx playwright install --with-deps chromium
      - name: Run upload verification
        run: |
          cat > verify.js <<'SCRIPT'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const zlib = require('zlib');

          const BASE = 'https://web-production-6db0ba.up.railway.app';

          function makePng(path, w, h, color) {
            function chunk(tag, data) {
              const len = Buffer.alloc(4);
              len.writeUInt32BE(data.length, 0);
              const tagBuf = Buffer.from(tag);
              const crcBuf = Buffer.alloc(4);
              const crc = require('zlib').crc32 ? null : null;
              return Buffer.concat([len, tagBuf, data]);
            }
            // Simple raw PNG encoder using zlib deflate directly.
            const sig = Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]);
            const ihdr = Buffer.alloc(13);
            ihdr.writeUInt32BE(w, 0);
            ihdr.writeUInt32BE(h, 4);
            ihdr[8] = 8; ihdr[9] = 2; ihdr[10] = 0; ihdr[11] = 0; ihdr[12] = 0;
            const rowLen = 1 + w * 3;
            const raw = Buffer.alloc(rowLen * h);
            for (let y = 0; y < h; y++) {
              raw[y * rowLen] = 0;
              for (let x = 0; x < w; x++) {
                raw[y * rowLen + 1 + x * 3] = color[0];
                raw[y * rowLen + 1 + x * 3 + 1] = color[1];
                raw[y * rowLen + 1 + x * 3 + 2] = color[2];
              }
            }
            const idatData = zlib.deflateSync(raw);

            function crcChunk(tag, data) {
              const CRC_TABLE = (() => {
                let c, table = [];
                for (let n = 0; n < 256; n++) {
                  c = n;
                  for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
                  table[n] = c;
                }
                return table;
              })();
              function crc32(buf) {
                let c = 0xffffffff;
                for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xff] ^ (c >>> 8);
                return (c ^ 0xffffffff) >>> 0;
              }
              const tagBuf = Buffer.from(tag);
              const len = Buffer.alloc(4);
              len.writeUInt32BE(data.length, 0);
              const crcBuf = Buffer.alloc(4);
              crcBuf.writeUInt32BE(crc32(Buffer.concat([tagBuf, data])), 0);
              return Buffer.concat([len, tagBuf, data, crcBuf]);
            }

            const out = Buffer.concat([
              sig,
              crcChunk('IHDR', ihdr),
              crcChunk('IDAT', idatData),
              crcChunk('IEND', Buffer.alloc(0)),
            ]);
            fs.writeFileSync(path, out);
          }

          makePng('/tmp/live-case-photo.png', 400, 225, [16, 185, 129]);

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            page.on('pageerror', (err) => console.log('[pageerror]', err.message));
            page.on('console', (msg) => { if (msg.type() === 'error') console.log('[console]', msg.text()); });

            await page.goto(BASE + '/admin/login', { waitUntil: 'load', timeout: 30000 });
            await page.fill('input[type="email"]', 'test@example.com');
            await page.fill('input[type="password"]', 'password');
            await page.click('button[type="submit"]');
            await page.waitForTimeout(2000);

            await page.goto(BASE + '/admin/fund-cases', { waitUntil: 'load', timeout: 30000 });
            await page.waitForTimeout(1500);
            const firstEditLink = page.locator('a[href*="/admin/fund-cases/"][href*="/edit"]').first();
            const editHref = await firstEditLink.getAttribute('href');
            console.log('EDIT_HREF:', editHref);

            await page.goto(editHref, { waitUntil: 'load', timeout: 30000 });
            await page.waitForTimeout(1500);

            const fileInput = page.locator('input[type="file"]');
            await fileInput.setInputFiles('/tmp/live-case-photo.png');
            await page.waitForSelector('text=Upload complete', { timeout: 25000 }).catch((e) => console.log('WAIT_UPLOAD_COMPLETE_FAILED:', e.message));
            await page.waitForTimeout(1000);

            const saveBtn = page.locator('button[type="submit"]:visible').last();
            await saveBtn.click();
            await page.waitForTimeout(2500);

            const bodyText = await page.textContent('body').catch(() => '');
            console.log('HAS_SERVER_ERROR:', /Server Error|Exception|Whoops|Internal Server Error/i.test(bodyText || ''));
            console.log('HAS_SUCCESS_NOTIFICATION:', /Сохранено/i.test(bodyText || ''));

            // Extract the case id from the edit URL to visit its public page
            const match = editHref.match(/fund-cases\/(\d+)\/edit/);
            const caseId = match ? match[1] : null;
            console.log('CASE_ID:', caseId);

            if (caseId) {
              await page.goto(BASE + '/cases/' + caseId, { waitUntil: 'load', timeout: 30000 });
              await page.waitForTimeout(1500);
              const img = page.locator('img').first();
              if (await img.count() > 0) {
                const src = await img.getAttribute('src');
                console.log('IMG_SRC:', src);
                const resp = await page.request.get(src);
                console.log('IMG_FETCH_STATUS:', resp.status());
                const buf = await resp.body();
                console.log('IMG_FETCH_BYTES:', buf.length);
              } else {
                console.log('NO_IMG_FOUND');
              }
            }

            await browser.close();
          })();
          SCRIPT
          node verify.js
